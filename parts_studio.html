<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🌱 새싹 숲 — 64×64 파츠 조립 & 도트 스튜디오</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body { margin: 0; background: #1e2128; color: #e8e6e3; font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { background: #262a34; padding: 8px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #393f4f; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 15px; color: #a7e3a1; margin-right: 8px; }
  button, select { background: #343a48; color: #eef; border: 1px solid #4c556a; border-radius: 5px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
  button:hover { background: #434b5d; }
  button.primary { background: #3e7c59; border-color: #5ea87d; color: #fff; font-weight: bold; }
  button.primary:hover { background: #4c946b; }
  button.active { background: #d68b38; border-color: #f3b562; color: #1b1b1b; font-weight: bold; }
  main { flex: 1; display: flex; overflow: hidden; }
  .left-tools { width: 175px; background: #232731; border-right: 1px solid #353b4a; padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #191c22; position: relative; overflow: hidden; padding: 10px; }
  .right-panel { width: 325px; background: #232731; border-left: 1px solid #353b4a; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .section-title { font-size: 11px; color: #9ab; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-weight: bold; border-bottom: 1px solid #343b4a; padding-bottom: 3px; }
  .canvas-wrap { position: relative; border: 2px solid #495266; background: repeating-conic-gradient(#2d323e 0% 25%, #252933 0% 50%) 50% / 16px 16px; cursor: crosshair; }
  canvas { image-rendering: pixelated; display: block; }
  .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .swatch { width: 26px; height: 26px; border-radius: 4px; border: 2px solid #111; cursor: pointer; }
  .swatch.sel { border-color: #fff; transform: scale(1.1); }
  .layer-card { background: #2b303c; border: 1px solid #3d4557; border-radius: 6px; padding: 7px; display: flex; flex-direction: column; gap: 5px; }
  .layer-card.editing { border-color: #f3b562; box-shadow: 0 0 0 1px #f3b562; }
  .layer-head { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .layer-head b { font-size: 12px; }
  .nudge { display: flex; align-items: center; gap: 4px; font-size: 11px; }
  .nudge button { padding: 2px 6px; font-size: 11px; }
  .timeline { height: 116px; background: #232731; border-top: 1px solid #353b4a; padding: 8px 12px; display: flex; align-items: center; gap: 10px; overflow-x: auto; }
  .thumb { width: 72px; height: 86px; background: #2d323e; border: 2px solid #424a5c; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .thumb.cur { border-color: #7ee787; background: #313b36; }
  .thumb span { font-size: 10px; color: #bbb; margin-top: 2px; }
  .mini-preview { background: #2d323e; border: 1px solid #4a5368; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #toast { position: fixed; bottom: 126px; left: 50%; transform: translateX(-50%); background: rgba(20,25,30,0.92); color: #a7f3a1; padding: 7px 14px; border-radius: 20px; border: 1px solid #5ea87d; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 99; }
</style>
</head>
<body>
<header>
  <h1>🌱 64×64 파츠 조립 & 도트 스튜디오</h1>
  <select id="animSel" onchange="selectAnim(this.value)"></select>
  <button onclick="addAnim()">+ 새 동작</button>
  <button id="btnPlay" class="primary" onclick="togglePlay()">▶ 재생</button>
  <label style="font-size:12px;">FPS <input type="number" id="fpsIn" value="7" min="1" max="20" style="width:44px;background:#1d2028;color:#fff;border:1px solid #4c556a;border-radius:4px;padding:2px 4px;" onchange="setFps(+this.value)"></label>
  <label style="font-size:12px;"><input type="checkbox" id="chkFlip" onchange="render()"> ↔ 좌우반전(flipX)</label>
  <label style="font-size:12px;"><input type="checkbox" id="chkGuide" checked onchange="render()"> 📏 발바닥(61)/허리 가이드</label>
  <div style="flex:1"></div>
  <button onclick="exportBakedSheet(false)">🖼️ 시트 굽기(빈손)</button>
  <button onclick="exportBakedSheet(true)">⚔️ 시트 굽기(무기포함)</button>
  <button class="primary" onclick="exportPoseTable()">💾 조립표 JSON</button>
  <button onclick="document.getElementById('jsonIn').click()">📂 조립표 열기</button>
  <input type="file" id="jsonIn" accept=".json" style="display:none" onchange="importPoseTable(this)">
</header>

<main>
  <div class="left-tools">
    <div>
      <div class="section-title">도트 수정 도구</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;">
        <button id="t_pen" class="active" onclick="setTool('pen')">✏️ 연필</button>
        <button id="t_era" onclick="setTool('eraser')">🧹 지우개</button>
        <button id="t_pick" onclick="setTool('picker')">💉 스포이드</button>
      </div>
      <div style="display:flex;gap:4px;">
        <button onclick="undo()" style="flex:1;">↩ 실행취소</button>
      </div>
    </div>

    <div>
      <div class="section-title">편집 중인 파츠</div>
      <div id="editInfo" style="font-size:11px;color:#ffd479;margin-bottom:6px;">legs / front_walk_0</div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <button onclick="downloadCurrentPart()">💾 이 파츠 PNG 저장</button>
        <button onclick="document.getElementById('pngIn').click()">📥 외부 PNG 덮어쓰기</button>
        <input type="file" id="pngIn" accept=".png" style="display:none" onchange="replaceCurrentPartPNG(this)">
      </div>
    </div>

    <div>
      <div class="section-title">클래식 팔레트</div>
      <div class="palette" id="palette"></div>
      <div style="margin-top:6px;display:flex;align-items:center;gap:6px;font-size:11px;">
        <span>현재색</span>
        <input type="color" id="colorPick" value="#482d26" onchange="curColor=this.value" style="width:36px;height:22px;border:none;background:none;cursor:pointer;">
      </div>
    </div>

    <div class="mini-preview">
      <div style="font-size:11px;color:#9ab;">실시간 2배율 미리보기</div>
      <canvas id="miniCv" width="128" height="128"></canvas>
    </div>
  </div>

  <div class="center">
    <div class="canvas-wrap">
      <canvas id="mainCv" width="512" height="512"></canvas>
    </div>
    <div style="margin-top:6px;font-size:11px;color:#9ab;">
      💡 오른쪽에서 <b>[✏️ 편집]</b> 누른 레이어만 캔버스에서 바로 수정되며, 같은 파츠를 쓰는 모든 프레임에 즉시 반영돼요! (단축키: B 연필 / E 지우개 / I 스포이드 / Ctrl+Z 실행취소)
    </div>
  </div>

  <div class="right-panel">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="section-title" style="margin:0;border:none;">6겹 파츠 조립표</div>
      <select id="sideSel" onchange="setAnimSide(this.value)">
        <option value="front">앞모습 Z순서</option>
        <option value="back">뒷모습 Z순서</option>
      </select>
    </div>
    <div id="layerControls" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>
</main>

<div class="timeline" id="timeline"></div>
<div id="toast"></div>

  '#482d26', '#c4906c', '#a37054', '#825744', '#e39578',

  { key: 'head',      label: '머리 (head)',       cat: 'head' },
  { key: 'torso',     label: '몸통 (torso)',      cat: 'torso' },

];

// Each part is stored as an offscreen 64x64 canvas so pixel edits are instant & live!
const PART_CANVASES = {};
const UNDO_STACK = [];
let curAnimKey = 'walk_front';
let curFrameIdx = 0;
let editLayerKey = 'legs';
let curTool = 'pen';
let curColor = '#482d26';
let layerVisible = { head: true, torso: true, legs: true, arm_front: true, arm_back: true, weapon: true };
let playing = false;
let playTimer = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._tm); t._tm = setTimeout(() => t.style.opacity = 0, 1800);
}

async function loadAllParts() {
  const promises = [];
  for (const [cat, items] of Object.entries(EMBEDDED_PARTS)) {
    PART_CANVASES[cat] = {};
    for (const [name, url] of Object.entries(items)) {
      promises.push(new Promise(res => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement('canvas'); c.width = 64; c.height = 64;
          c.getContext('2d').drawImage(im, 0, 0);
          PART_CANVASES[cat][name] = c;
          res();
        };
        im.src = url;
      }));
    }
  }
  await Promise.all(promises);
}

function initPalette() {
  const wrap = document.getElementById('palette');
  wrap.innerHTML = '';
  for (const hex of PALETTE) {
    const d = document.createElement('div');
    d.className = 'swatch' + (hex === curColor ? ' sel' : '');
    d.style.background = hex;
    d.title = hex;
    d.onclick = () => {
      curColor = hex;
      document.getElementById('colorPick').value = hex;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('sel'));
      d.classList.add('sel');
      setTool('pen');
    };
    wrap.appendChild(d);
  }
}

function setTool(t) {
  curTool = t;
  ['pen', 'era', 'pick'].forEach(id => document.getElementById('t_' + id).classList.remove('active'));
  const map = { pen: 't_pen', eraser: 't_era', picker: 't_pick' };
  document.getElementById(map[t]).classList.add('active');
}

function getAnim() { return POSE_TABLE.animations[curAnimKey]; }
function getFrame() {
  const a = getAnim();
  if (curFrameIdx >= a.frames.length) curFrameIdx = 0;
  return a.frames[curFrameIdx];
}

function getLayerOffset(f, key) {
  const ox = f['ox_' + key] || 0;
  const oy = f['oy_' + key] || 0;
  const dyUp = (key === 'head' || key === 'torso' || key === 'arm_front' || key === 'arm_back' || key === 'weapon') ? (f.dy_upper || 0) : 0;
  const dxArm = (key === 'arm_front') ? (f.dx_af || 0) : ((key === 'arm_back') ? (f.dx_ab || 0) : 0);
  return [ox + dxArm, oy + dyUp];
}

function getLayerOrder(anim, f) {
  const base = [...(POSE_TABLE.layer_order[anim.side] || POSE_TABLE.layer_order.front)];
  if (f.weapon_z === 'front') {
    const idx = base.indexOf('weapon');
    if (idx >= 0) { base.splice(idx, 1); base.push('weapon'); }
  } else if (f.weapon_z === 'back') {
    const idx = base.indexOf('weapon');
    if (idx >= 0) { base.splice(idx, 1); base.unshift('weapon'); }
  }
  return base;
}

function compositeFrame64(anim, f, includeWeapon = true, flipX = false) {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  if (flipX) { g.translate(64, 0); g.scale(-1, 1); }
  if (anim.whole && f.whole) {
    const part = PART_CANVASES.rope[f.whole];
    if (part) g.drawImage(part, 0, 0);
    return c;
  }
  const order = getLayerOrder(anim, f);
  for (const key of order) {
    if (!layerVisible[key]) continue;
    if (key === 'weapon' && !includeWeapon) continue;
    const pname = f[key];
    if (!pname || pname === 'none') continue;
    const part = PART_CANVASES[key] && PART_CANVASES[key][pname];
    if (!part) continue;
    const [dx, dy] = getLayerOffset(f, key);
    g.drawImage(part, dx, dy);
  }
  return c;
}

function render() {
  const anim = getAnim();
  const f = getFrame();
  const flipX = document.getElementById('chkFlip').checked;
  const comp = compositeFrame64(anim, f, true, flipX);

  const mainCv = document.getElementById('mainCv');
  const mg = mainCv.getContext('2d');
  mg.imageSmoothingEnabled = false;
  mg.clearRect(0, 0, 512, 512);
  mg.drawImage(comp, 0, 0, 512, 512);

  if (document.getElementById('chkGuide').checked) {
    mg.strokeStyle = 'rgba(255, 90, 90, 0.55)';
    mg.lineWidth = 1;
    mg.beginPath(); mg.moveTo(0, 62 * 8); mg.lineTo(512, 62 * 8); mg.stroke();
    mg.strokeStyle = 'rgba(110, 210, 255, 0.45)';
    mg.beginPath(); mg.moveTo(0, 47 * 8); mg.lineTo(512, 47 * 8); mg.stroke();
  }

  const mini = document.getElementById('miniCv').getContext('2d');
  mini.imageSmoothingEnabled = false;
  mini.clearRect(0, 0, 128, 128);
  mini.drawImage(comp, 0, 0, 128, 128);

  renderTimeline();
  updateEditInfo();
}

function updateEditInfo() {
  const anim = getAnim(), f = getFrame();
  if (anim.whole) {
    document.getElementById('editInfo').textContent = 'rope / ' + (f.whole || 'none');
  } else {
    document.getElementById('editInfo').textContent = editLayerKey + ' / ' + (f[editLayerKey] || 'none');
  }
}

function renderAnimSelect() {
  const sel = document.getElementById('animSel');
  sel.innerHTML = '';
  for (const k of Object.keys(POSE_TABLE.animations)) {
    const opt = document.createElement('option');
    opt.value = k; opt.textContent = k;
    if (k === curAnimKey) opt.selected = true;
    sel.appendChild(opt);
  }
}

function renderLayerControls() {
  const anim = getAnim(), f = getFrame();
  document.getElementById('sideSel').value = anim.side || 'front';
  document.getElementById('fpsIn').value = anim.fps || 7;
  const wrap = document.getElementById('layerControls');
  wrap.innerHTML = '';

  if (anim.whole) {
    const card = document.createElement('div');
    card.className = 'layer-card editing';
    const opts = Object.keys(PART_CANVASES.rope).map(n => `<option value="${n}" ${f.whole===n?'selected':''}>${n}</option>`).join('');
    card.innerHTML = `<div class="layer-head"><b>통짜 프레임 (rope)</b></div>
      <select onchange="getFrame().whole=this.value;render()">${opts}</select>`;
    wrap.appendChild(card);
    return;
  }

  // Upper body bounce quick control
  const upCard = document.createElement('div');
  upCard.className = 'layer-card';
  upCard.innerHTML = `
    <div class="layer-head"><b>상체 통째 Y 오프셋 (숨쉬기/바운스)</b>
      <div class="nudge">
        <button onclick="nudgeUpper(-1)">-1</button>
        <span style="min-width:20px;text-align:center;">${f.dy_upper || 0}</span>
        <button onclick="nudgeUpper(1)">+1</button>
      </div>
    </div>`;
  wrap.appendChild(upCard);

  for (const m of LAYER_META) {
    const card = document.createElement('div');
    card.className = 'layer-card' + (editLayerKey === m.key ? ' editing' : '');
    const names = ['none', ...Object.keys(PART_CANVASES[m.cat] || {})];
    const curVal = f[m.key] || 'none';
    const opts = names.map(n => `<option value="${n}" ${curVal===n?'selected':''}>${n}</option>`).join('');
    const [dx, dy] = getLayerOffset(f, m.key);
    const wzHtml = (m.key === 'weapon') ? `
      <select style="font-size:11px;padding:2px 4px;" onchange="getFrame().weapon_z=this.value;render()">
        <option value="" ${!f.weapon_z?'selected':''}>기본 Z</option>
        <option value="front" ${f.weapon_z==='front'?'selected':''}>맨앞</option>
        <option value="back" ${f.weapon_z==='back'?'selected':''}>맨뒤</option>
      </select>` : '';
    card.innerHTML = `
      <div class="layer-head">
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
          <input type="checkbox" ${layerVisible[m.key]?'checked':''} onchange="layerVisible['${m.key}']=this.checked;render()">
          <b>${m.label}</b>
        </label>
        <div style="display:flex;gap:4px;align-items:center;">
          ${wzHtml}
          <button class="${editLayerKey===m.key?'active':''}" style="padding:2px 6px;font-size:11px;" onclick="editLayerKey='${m.key}';renderLayerControls();updateEditInfo();">✏️ 편집</button>
        </div>
      </div>
      <div style="display:flex;gap:4px;align-items:center;">
        <select style="flex:1;" onchange="getFrame()['${m.key}']=this.value;render();updateEditInfo();">${opts}</select>
        <div class="nudge">
          <span>X:${dx}</span>
          <button onclick="nudgeLayer('${m.key}','x',-1)">◀</button>
          <button onclick="nudgeLayer('${m.key}','x',1)">▶</button>
          <span>Y:${dy}</span>
          <button onclick="nudgeLayer('${m.key}','y',-1)">▲</button>
          <button onclick="nudgeLayer('${m.key}','y',1)">▼</button>
        </div>
      </div>`;
    wrap.appendChild(card);
  }
}

function nudgeUpper(d) {
  const f = getFrame();
  f.dy_upper = (f.dy_upper || 0) + d;
  renderLayerControls(); render();
}
function nudgeLayer(key, axis, d) {
  const f = getFrame();
  const field = (axis === 'x' ? 'ox_' : 'oy_') + key;
  f[field] = (f[field] || 0) + d;
  renderLayerControls(); render();
}

function renderTimeline() {
  const anim = getAnim();
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  anim.frames.forEach((fr, idx) => {
    const div = document.createElement('div');
    div.className = 'thumb' + (idx === curFrameIdx ? ' cur' : '');
    const c = document.createElement('canvas'); c.width = 64; c.height = 64;
    c.getContext('2d').drawImage(compositeFrame64(anim, fr, true, document.getElementById('chkFlip').checked), 0, 0);
    div.appendChild(c);
    const sp = document.createElement('span'); sp.textContent = 'f' + idx;
    div.appendChild(sp);
    div.onclick = () => { curFrameIdx = idx; renderLayerControls(); render(); };
    tl.appendChild(div);
  });
  const btns = document.createElement('div');
  btns.style.display = 'flex'; btns.style.flexDirection = 'column'; btns.style.gap = '4px';
  btns.innerHTML = `
    <button onclick="dupFrame()">+ 복제</button>
    <button onclick="delFrame()">🗑 삭제</button>`;
  tl.appendChild(btns);
}

function dupFrame() {
  const anim = getAnim();
  anim.frames.splice(curFrameIdx + 1, 0, JSON.parse(JSON.stringify(getFrame())));
  curFrameIdx++;
  renderLayerControls(); render();
}
function delFrame() {
  const anim = getAnim();
  if (anim.frames.length <= 1) return;
  anim.frames.splice(curFrameIdx, 1);
  curFrameIdx = Math.max(0, curFrameIdx - 1);
  renderLayerControls(); render();
}
function selectAnim(k) { curAnimKey = k; curFrameIdx = 0; renderLayerControls(); render(); }
function setAnimSide(s) { getAnim().side = s; render(); }
function setFps(v) { getAnim().fps = Math.max(1, Math.min(20, v || 7)); if (playing) { togglePlay(); togglePlay(); } }
function addAnim() {
  const name = prompt('새 동작 이름 (예: jump_front):');
  if (!name || POSE_TABLE.animations[name]) return;
  POSE_TABLE.animations[name] = JSON.parse(JSON.stringify(getAnim()));
  curAnimKey = name; curFrameIdx = 0;
  renderAnimSelect(); renderLayerControls(); render();
}
function togglePlay() {
  playing = !playing;
  const btn = document.getElementById('btnPlay');
  btn.textContent = playing ? '⏹ 정지' : '▶ 재생';
  clearInterval(playTimer);
  if (playing) {
    const fps = getAnim().fps || 7;
    playTimer = setInterval(() => {
      curFrameIdx = (curFrameIdx + 1) % getAnim().frames.length;
      render();
    }, Math.round(1000 / fps));
  }
}

// Direct pixel editing on the active part canvas!
function getTargetPart() {
  const anim = getAnim(), f = getFrame();
  if (anim.whole) return { cat: 'rope', name: f.whole, dx: 0, dy: 0 };
  const name = f[editLayerKey];
  if (!name || name === 'none') return null;
  const [dx, dy] = getLayerOffset(f, editLayerKey);
  return { cat: editLayerKey, name, dx, dy };
}

let isDrawing = false;
const mainCv = document.getElementById('mainCv');
function getGridXY(e) {
  const r = mainCv.getBoundingClientRect();
  let x = Math.floor(((e.clientX - r.left) / r.width) * 64);
  const y = Math.floor(((e.clientY - r.top) / r.height) * 64);
  if (document.getElementById('chkFlip').checked) x = 63 - x;
  return [x, y];
}

function applyTool(e, isStart) {
  const [gx, gy] = getGridXY(e);
  if (gx < 0 || gx >= 64 || gy < 0 || gy >= 64) return;
  if (curTool === 'picker') {
    const comp = compositeFrame64(getAnim(), getFrame(), true, false);
    const p = comp.getContext('2d').getImageData(gx, gy, 1, 1).data;
    if (p[3] > 0) {
      curColor = '#' + [p[0],p[1],p[2]].map(v => v.toString(16).padStart(2,'0')).join('');
      document.getElementById('colorPick').value = curColor;
      setTool('pen');
      toast('색 추출: ' + curColor);
    }
    return;
  }
  const tgt = getTargetPart();
  if (!tgt) { toast('편집할 파츠가 선택되지 않았어요!'); return; }
  const pc = PART_CANVASES[tgt.cat][tgt.name];
  if (!pc) return;
  const px = gx - tgt.dx, py = gy - tgt.dy;
  if (px < 0 || px >= 64 || py < 0 || py >= 64) return;
  const pg = pc.getContext('2d');
  if (isStart) {
    UNDO_STACK.push({ cat: tgt.cat, name: tgt.name, img: pg.getImageData(0, 0, 64, 64) });
    if (UNDO_STACK.length > 40) UNDO_STACK.shift();
  }
  if (curTool === 'pen') {
    pg.fillStyle = curColor;
    pg.fillRect(px, py, 1, 1);
  } else if (curTool === 'eraser') {
    pg.clearRect(px, py, 1, 1);
  }
  render();
}

mainCv.addEventListener('pointerdown', e => {
  if (playing) return;
  isDrawing = true;
  mainCv.setPointerCapture(e.pointerId);
  applyTool(e, true);
});
mainCv.addEventListener('pointermove', e => { if (isDrawing) applyTool(e, false); });
window.addEventListener('pointerup', () => { isDrawing = false; });

function undo() {
  if (!UNDO_STACK.length) return;
  const u = UNDO_STACK.pop();
  PART_CANVASES[u.cat][u.name].getContext('2d').putImageData(u.img, 0, 0);
  render();
  toast('실행 취소됨');
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.ctrlKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if (e.key.toLowerCase() === 'b') setTool('pen');
  else if (e.key.toLowerCase() === 'e') setTool('eraser');
  else if (e.key.toLowerCase() === 'i') setTool('picker');
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});

function downloadBlob(url, filename) {
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
}
function downloadCurrentPart() {
  const tgt = getTargetPart();
  if (!tgt) return;
  downloadBlob(PART_CANVASES[tgt.cat][tgt.name].toDataURL(), `${tgt.cat}_${tgt.name}.png`);
  toast(`저장됨: ${tgt.cat}_${tgt.name}.png`);
}
function replaceCurrentPartPNG(input) {
  const file = input.files[0]; if (!file) return;
  const tgt = getTargetPart(); if (!tgt) return;
  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();
    im.onload = () => {
      const pc = PART_CANVASES[tgt.cat][tgt.name];
      const pg = pc.getContext('2d');
      UNDO_STACK.push({ cat: tgt.cat, name: tgt.name, img: pg.getImageData(0, 0, 64, 64) });
      pg.clearRect(0, 0, 64, 64);
      pg.drawImage(im, 0, 0, 64, 64);
      render();
      toast(`외부 PNG 반영 완료: ${tgt.cat}/${tgt.name}`);
    };
    im.src = reader.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function exportBakedSheet(includeWeapon) {
  const anim = getAnim();
  const c = document.createElement('canvas');
  c.width = 64 * anim.frames.length; c.height = 64;
  const g = c.getContext('2d');
  anim.frames.forEach((fr, i) => {
    g.drawImage(compositeFrame64(anim, fr, includeWeapon, false), i * 64, 0);
  });
  const suffix = includeWeapon ? '_with_weapon' : '';
  downloadBlob(c.toDataURL(), `${curAnimKey}${suffix}.png`);
  toast(`시트 굽기 완료: ${curAnimKey}${suffix}.png (${c.width}×64)`);
}
function exportPoseTable() {
  const blob = new Blob([JSON.stringify(POSE_TABLE, null, 2)], { type: 'application/json' });
  downloadBlob(URL.createObjectURL(blob), 'pose_table.json');
  toast('pose_table.json 저장 완료!');
}
function importPoseTable(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    POSE_TABLE = JSON.parse(reader.result);
    curAnimKey = Object.keys(POSE_TABLE.animations)[0];
    curFrameIdx = 0;
    renderAnimSelect(); renderLayerControls(); render();
    toast('조립표 JSON 불러오기 완료!');
  };
  reader.readAsText(file);
  input.value = '';
}

loadAllParts().then(() => {
  initPalette();
  renderAnimSelect();
  renderLayerControls();
  render();
});
</script>
